<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.18" stop-color="#1e0838"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="0.82" stop-color="#1e0838"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feFlood flood-color="#e879f9" flood-opacity="0.8"/>
      <feComposite operator="in" in2="b"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shape">
      <path d="M0,0 H1000 V170 C930,200 870,215 800,195 C720,172 660,150 580,172 C500,195 440,215 360,192 C280,170 220,150 140,175 C90,190 40,200 0,188 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="url(#glow)"/>
    <path d="M0,150 C140,125 220,135 360,160 C440,175 500,170 580,150 C660,130 720,140 800,165 C870,185 930,170 1000,150" fill="none" stroke="#e9d5ff" stroke-opacity="0.18" stroke-width="2"/>
    <text x="500" y="112" text-anchor="middle" font-family="'Segoe UI Black', 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="900" letter-spacing="2" fill="url(#name)" filter="url(#neon)">EMILY ALVES</text>
  </g>
</svg>
